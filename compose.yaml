# DXH Gateway Community Edition. Quick start: see README.md.
# Needs a .env next to this file with POSTGRES_PASSWORD, BETTER_AUTH_SECRET,
# GATEWAY_ENCRYPTION_KEY and GATEWAY_CE_TERMS_ACCEPTED (see .env.example).
services:
  gateway:
    # Override with GATEWAY_IMAGE, e.g. ghcr.io/dxheroes/mcp-gateway-ce:<tag> or an image@sha256:… digest.
    # Coolify stores the default below as the variable's value once; update the image there by
    # changing GATEWAY_IMAGE.
    image: ${GATEWAY_IMAGE:-docker.io/dxheroes/mcp-gateway-ce:v0.6.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    # Required values come from .env (see .env.example). Nothing follows `:?` on purpose: Coolify
    # stores that text as the variable's value, which would turn these secrets into public strings.
    environment:
      DATABASE_URL: postgresql://gateway:${POSTGRES_PASSWORD:?}@postgres:5432/gateway
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3001}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      GATEWAY_ENCRYPTION_KEY: ${GATEWAY_ENCRYPTION_KEY:?}
      # Read LICENSE-CE.txt, then accept it with GATEWAY_CE_TERMS_ACCEPTED=2026-09-18.1.
      GATEWAY_CE_TERMS_ACCEPTED: ${GATEWAY_CE_TERMS_ACCEPTED:?}
      AUTH_SIGNUP_MODE: ${AUTH_SIGNUP_MODE:-open}
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: gateway
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - database:/var/lib/postgresql/data
volumes:
  database:
