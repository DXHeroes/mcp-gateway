{{- if and .Values.secret.create (not .Values.secret.existingSecret) -}}
{{- /*
  Chart-managed Secret for dev/kind ONLY. Production must use existingSecret
  (Vault / External Secrets Operator). Fail fast if the required, immutable
  encryption key is missing — the app refuses to start without it anyway.
*/ -}}
{{- if not (index .Values.secret.values "GATEWAY_ENCRYPTION_KEY") }}
{{- fail "secret.create is true but secret.values.GATEWAY_ENCRYPTION_KEY is not set (required, minimum 16 characters). Set it, or use secret.existingSecret in production." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "local-mcp-gateway.fullname" . }}
  labels:
    {{- include "local-mcp-gateway.labels" . | nindent 4 }}
  annotations:
    # Create as a hook (weight below the migrate Job's -5) so this dev-only
    # Secret exists before the pre-install/pre-upgrade migration hook runs, then
    # persists for the Deployment. Production uses secret.existingSecret instead,
    # which is created out of band and is not a hook.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secret.values }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
