apiVersion: v2
name: mcp-gateway
description: |
  DXH Gateway — aggregates multiple MCP servers behind a single
  authenticated endpoint. OpenShift-native chart hardened for the
  restricted-v2 SCC (arbitrary UID, read-only root filesystem, no
  privilege escalation).
type: application
# Chart and application use the same Gateway product version. Production
# deployments should still pin image.digest rather than relying on the tag.
version: 1.0.0-beta.6
appVersion: "1.0.0-beta.6"
kubeVersion: ">=1.25.0-0"
keywords:
  - mcp
  - gateway
  - openshift
home: https://github.com/dxheroes/mcp-gateway
sources:
  - https://github.com/dxheroes/mcp-gateway
maintainers:
  - name: DX Heroes
    url: https://dxheroes.io
