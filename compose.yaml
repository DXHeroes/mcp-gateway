services:
  gateway:
    image: ${GATEWAY_IMAGE:?Set a published immutable image digest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      DATABASE_URL: postgresql://gateway:${POSTGRES_PASSWORD:?Set database password}@postgres:5432/gateway
      BETTER_AUTH_URL: ${PUBLIC_URL:-http://localhost:3001}
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:3001}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set an independent random secret}
      GATEWAY_ENCRYPTION_KEY: ${GATEWAY_ENCRYPTION_KEY:?Set an independent random secret}
      GATEWAY_CE_TERMS_ACCEPTED: ${GATEWAY_CE_TERMS_ACCEPTED:?Read and accept CE terms version 2026-09-17.1}
      GATEWAY_CE_USE: ${GATEWAY_CE_USE:?Choose production or evaluation}
      AUTH_SIGNUP_MODE: ${AUTH_SIGNUP_MODE:-open}
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set database password}
      POSTGRES_DB: gateway
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - database:/var/lib/postgresql/data
volumes:
  database:
